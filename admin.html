
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - Paroisse Saint-Marc</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background: #8D241F;
      color: white;
      padding: 22px;
      text-align: center;
    }
    main {
      max-width: 480px;
      margin: 45px auto;
      padding: 25px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 3px 15px #00000015;
    }
    h2 { text-align: center; }
    input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      background: #8D241F;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #681a17; }
    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<header>
  <h1>Administration</h1>
  <p>Paroisse Saint-Marc des Toits-Rouges</p>
</header>

<main>
  <section id="login">
    <h2>Connexion administrateur</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Adresse e-mail" required>
      <input type="password" id="password" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
    </form>
    <p id="message"></p>
  </section>

 
<section id="dashboard" class="hidden">
  <h2>Bienvenue dans l'administration</h2>
  <p>Vous êtes connecté en tant qu'administrateur.</p>

  <hr>

  <h2>Gestion des actualités</h2>

  <form id="newsForm">
    <input type="hidden" id="newsId">

    <input
      type="text"
      id="newsTitle"
      placeholder="Titre de l'actualité"
      required
    >

    <textarea
      id="newsContent"
      placeholder="Contenu de l'actualité"
      rows="6"
      required
    ></textarea>

    <input
      type="url"
      id="newsImage"
      placeholder="Lien de l'image (facultatif)"
    >

    <label for="newsStatus">Statut de l'actualité :</label>
    <select id="newsStatus">
      <option value="brouillon">Brouillon</option>
      <option value="publie">Publier</option>
    </select>

    <button type="submit" id="saveNews">
      Enregistrer l'actualité
    </button>

    <button type="button" id="cancelEdit">
      Annuler
    </button>
  </form>

  <hr>

  <h2>Liste des actualités</h2>
  <div id="newsList">
    Chargement des actualités...
  </div>

  <button id="logout">Se déconnecter</button>
</section>
</main>

<script>
const SUPABASE_URL = "https://yheyyjevcmlcujribfhp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_2fjZEsGcJ19caWo3vpR43A_l-x1w5-3";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const loginSection = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const loginForm = document.getElementById("loginForm");
const newsForm = document.getElementById("newsForm");
const newsList = document.getElementById("newsList");
const message = document.getElementById("message");

const newsId = document.getElementById("newsId");
const newsTitle = document.getElementById("newsTitle");
const newsContent = document.getElementById("newsContent");
const newsImage = document.getElementById("newsImage");
const newsStatus = document.getElementById("newsStatus");

// VERIFICATION DE L'ADMINISTRATEUR
async function checkAdmin() {
  const { data: userData, error: userError } =
    await supabaseClient.auth.getUser();

  if (userError || !userData.user) {
    dashboard.classList.add("hidden");
    loginSection.classList.remove("hidden");
    return false;
  }

  const { data: admin, error } = await supabaseClient
    .from("parish_admins")
    .select("user_id")
    .eq("user_id", userData.user.id)
    .maybeSingle();

  if (error || !admin) {
    await supabaseClient.auth.signOut();
    dashboard.classList.add("hidden");
    loginSection.classList.remove("hidden");
    message.textContent = "Accès refusé : vous n'êtes pas administrateur.";
    return false;
  }

  loginSection.classList.add("hidden");
  dashboard.classList.remove("hidden");

  await loadNews();
  return true;
}

// CONNEXION
loginForm.addEventListener("submit", async function(e) {
  e.preventDefault();

  message.textContent = "Connexion en cours...";

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = "Erreur de connexion : " + error.message;
    return;
  }

  const isAdmin = await checkAdmin();

  if (isAdmin) {
    message.textContent = "";
    loginForm.reset();
  }
});

// AFFICHER LES ACTUALITES
async function loadNews() {
  newsList.textContent = "Chargement des actualités...";

  const { data, error } = await supabaseClient
    .from("actualites")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    newsList.textContent = "Erreur : " + error.message;
    console.error(error);
    return;
  }

  newsList.innerHTML = "";

  if (!data || data.length === 0) {
    newsList.textContent = "Aucune actualité enregistrée.";
    return;
  }

  data.forEach(news => {
    const article = document.createElement("div");
    const titre = document.createElement("h3");
    const contenu = document.createElement("p");
    const statut = document.createElement("p");
    const modifier = document.createElement("button");
    const supprimer = document.createElement("button");

    titre.textContent = news.titre;
    contenu.textContent = news.contenu;
    statut.textContent = "Statut : " + news.statut;

    modifier.textContent = "Modifier";
    modifier.type = "button";

    modifier.addEventListener("click", function() {
      newsId.value = news.id;
      newsTitle.value = news.titre;
      newsContent.value = news.contenu;
      newsImage.value = news.image_url || "";
      newsStatus.value = news.statut;

      document.getElementById("saveNews").textContent =
        "Mettre à jour l'actualité";

      newsForm.scrollIntoView({ behavior: "smooth" });
    });

    supprimer.textContent = "Supprimer";
    supprimer.type = "button";

    supprimer.addEventListener("click", async function() {
      if (!confirm("Voulez-vous vraiment supprimer cette actualité ?")) {
        return;
      }

      const { error } = await supabaseClient
        .from("actualites")
        .delete()
        .eq("id", news.id);

      if (error) {
        alert("Erreur de suppression : " + error.message);
        return;
      }

      alert("Actualité supprimée avec succès.");
      await loadNews();
    });

    article.style.border = "1px solid #ddd";
    article.style.padding = "15px";
    article.style.marginBottom = "15px";

    article.appendChild(titre);
    article.appendChild(contenu);
    article.appendChild(statut);
    article.appendChild(modifier);
    article.appendChild(supprimer);

    newsList.appendChild(article);
  });
}

// ENREGISTRER OU MODIFIER UNE ACTUALITE
newsForm.addEventListener("submit", async function(e) {
  e.preventDefault();

  const id = newsId.value;

  const actualite = {
    titre: newsTitle.value.trim(),
    contenu: newsContent.value.trim(),
    image_url: newsImage.value.trim() || null,
    statut: newsStatus.value,
    updated_at: new Date().toISOString()
  };

  let result;

  if (id) {
    result = await supabaseClient
      .from("actualites")
      .update(actualite)
      .eq("id", id);
  } else {
    result = await supabaseClient
      .from("actualites")
      .insert([actualite]);
  }

  if (result.error) {
    alert("Erreur : " + result.error.message);
    console.error(result.error);
    return;
  }

  alert(id ? "Actualité modifiée avec succès." :
              "Actualité enregistrée avec succès.");

  newsForm.reset();
  newsId.value = "";

  document.getElementById("saveNews").textContent =
    "Enregistrer l'actualité";

  await loadNews();
});

// ANNULER UNE MODIFICATION
document.getElementById("cancelEdit").addEventListener("click", function() {
  newsForm.reset();
  newsId.value = "";

  document.getElementById("saveNews").textContent =
    "Enregistrer l'actualité";
});

// DECONNEXION
document.getElementById("logout").addEventListener("click", async function() {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    alert("Erreur de déconnexion : " + error.message);
    return;
  }

  dashboard.classList.add("hidden");
  loginSection.classList.remove("hidden");
  message.textContent = "Vous êtes déconnecté.";
});

// VERIFIER LA SESSION AU CHARGEMENT
checkAdmin();
</script>

</body>
</html>
